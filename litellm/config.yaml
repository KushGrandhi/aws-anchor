# LiteLLM gateway config.
# Every app talks to http://<anchor>:4000/v1 with your master key.
# To grow the system, add entries here — nothing upstream changes.

model_list:
  # ---- Cloud models (work on day one) ----
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- Local / rented GPU nodes (uncomment when a node joins your tailnet) ----
  # Use the node's Tailscale IP (run `tailscale ip -4` on that node).
  # Run scripts/join-gpu-node.sh on the GPU machine first.
  #
  # - model_name: local-chat
  #   litellm_params:
  #     model: ollama_chat/qwen3:8b
  #     api_base: http://100.x.y.z:11434
  #
  # Same name on two backends = LiteLLM load-balances between them:
  # - model_name: local-chat
  #   litellm_params:
  #     model: ollama_chat/qwen3:8b
  #     api_base: http://100.a.b.c:11434   # e.g. a rented GPU

router_settings:
  # If a local node is down, fall back to a cloud model automatically.
  # Uncomment once "local-chat" exists:
  # fallbacks: [{"local-chat": ["claude-haiku"]}]
  num_retries: 2

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
