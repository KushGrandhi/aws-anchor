# Anchor stack: the always-on "brain" of your personal LLM layer.
# Gateway = your own llm_routing_server (cloned into ./gateway-src by scripts/bootstrap.sh).
# Everything binds to 127.0.0.1 only — nothing is exposed to the public internet.
# Remote access happens through Tailscale (see scripts/expose.sh).

services:
  # Cache + rate-limit storage for the gateway. Internal network only, no published port.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Your gateway: one OpenAI-compatible endpoint for every app/device you own.
  # Routes to cloud APIs today; GPU nodes get added in gateway/models.yaml later.
  gateway:
    build: ./gateway-src
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Fewer workers than the repo default — sized for a 2 GB Lightsail instance.
    command: ["gunicorn", "run:flask_application", "--bind", "0.0.0.0:5000",
              "--workers", "2", "--threads", "4", "--timeout", "300",
              "--access-logfile", "-", "--error-logfile", "-"]
    environment:
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CACHE_ENABLED: "true"
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_STORAGE_URI: redis://redis:6379
      RATE_LIMIT_DEFAULT: "120 per minute"
    volumes:
      # The anchor's own model list overrides the repo's example config.
      - ./gateway/models.yaml:/app/config/models.yaml:ro
      - gateway_data:/app/data          # SQLite usage log
    ports:
      - "127.0.0.1:5000:5000"

  # Chat UI: your Claude-style interface, works on phone and desktop.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      OPENAI_API_BASE_URL: http://gateway:5000/v1
      OPENAI_API_KEY: ${WEBUI_GATEWAY_KEY}
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    volumes:
      - webui:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"

  # Aurora: a screen your Claude draws on over MCP; each view gets a share link.
  # The ONE public service: reached through Tailscale Funnel on :10000 (scripts/expose.sh).
  # Using it needs a workspace key (minted with the invite code); share links are view-only.
  # Built on the server from a release tag (change AURORA_VERSION to upgrade).
  aurora:
    build: https://github.com/KushGrandhi/aurora.git#${AURORA_VERSION:-v0.9.1}
    image: aurora:${AURORA_VERSION:-v0.9.1}
    restart: unless-stopped
    environment:
      AURORA_MODE: hosted
      AURORA_SECRET: ${AURORA_SECRET}
      AURORA_INVITE: ${AURORA_INVITE}
      AURORA_PUBLIC_URL: ${AURORA_PUBLIC_URL}
    volumes:
      - aurora:/data
    ports:
      - "127.0.0.1:4317:4317"
    mem_limit: 768m

  # Caddy: aurora on its own domain (AURORA_DOMAIN, e.g. aurora.example.com) over 443 with automatic TLS, for MCP
  # clients that can't reach the Funnel address (ChatGPT's servers never connect to *.ts.net:10000). Bound to the
  # instance's private address only (Lightsail maps the static IP to it); tailscaled keeps its own :443 on the tailnet.
  # Needs the Lightsail firewall open on 80 and 443. Off unless started: docker compose --profile domain up -d caddy
  caddy:
    image: caddy:2.10
    profiles: ["domain"]
    restart: unless-stopped
    depends_on:
      - aurora
    environment:
      AURORA_DOMAIN: ${AURORA_DOMAIN}
    command: caddy reverse-proxy --from ${AURORA_DOMAIN} --to aurora:4317
    ports:
      - "${PRIVATE_IP:-0.0.0.0}:80:80"
      - "${PRIVATE_IP:-0.0.0.0}:443:443"
    volumes:
      - caddy_data:/data
    mem_limit: 128m

volumes:
  caddy_data:
  redis_data:
  gateway_data:
  webui:
  aurora:
